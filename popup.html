<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  body { font: 14px/1.4 system-ui, sans-serif; width: 270px; margin: 12px; color: #222; }
  h1 { font-size: 16px; margin: 0 0 8px; color: #4f46e5; }
  p { margin: 6px 0; }
  button { width: 100%; padding: 8px; border: 0; border-radius: 8px; background: #eee; cursor: pointer; margin-top: 8px; }
</style>
</head>
<body>
  <h1>Resubir Armario</h1>
  <p>Abre Vinted y pulsa el botón redondo <b>🔁</b> de abajo a la derecha.</p>
  <p>Artículos resubidos: <b id="count">0</b></p>
  <p id="queue"></p>
  <p id="pending" style="color:#c00;display:none">Hay publicaciones pendientes de reintentar. Ábrelas desde el panel 🔁 en Vinted.</p>
  <button id="export" style="display:none">Descargar copias pendientes (.json)</button>
  <script src="popup.js"></script>
</body>
</html>
